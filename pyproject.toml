[project]
name = "customer-support-agentic-rag"
version = "0.1.0"
description = "LangGraph customer-support agent: guarded hybrid RAG, intent routing, order tools and human-approved refunds"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.9.0.post1",
    "fastapi>=0.115.7",
    "langchain>=0.3.26",
    "langchain-community>=0.3.15",
    "langchain-groq>=0.3.8",
    "langchain-huggingface>=0.1.2",
    "langchain-ollama",
    "langgraph>=0.2.67",
    "llm-guard[onnxruntime]>=0.3.15",
    "loguru>=0.7.3",
    "polars>=1.22.0",
    "pyarrow>=19.0.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.4.0",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]",
    "pre-commit>=4.1.0",
    "pylint>=3.3.7",
    "pytest>=8.3.4",
    "ruff>=0.9.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
